appId: com.photosort.app
productName: Photosort
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# Pas d'auto-update : la publication se fait via la release GitHub du workflow.
publish: null
directories:
  output: release
files:
  - out/**
extraResources:
  - from: resources/bin/
    to: bin/
    filter: ["**/*"]
icon: resources/icon.png
afterPack: scripts/after-pack.cjs
mac:
  category: public.app-category.photography
  target: [dmg]
  # Signature Developer ID + notarisation : actives uniquement si les secrets sont
  # fournis (CSC_LINK / CSC_KEY_PASSWORD, puis APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD +
  # APPLE_TEAM_ID, ou APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER).
  # Sans eux (CSC_IDENTITY_AUTO_DISCOVERY=false) l'installeur reste non signe.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
win:
  target: [portable]
linux:
  target: [AppImage, deb]
  category: Graphics
  # Le .deb exige un mainteneur (et un homepage, lu dans package.json).
  maintainer: Shosta <remi.lavedrine@outlook.com>
  synopsis: Classement de photos par date EXIF
