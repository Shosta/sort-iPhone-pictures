name: Deploy website

# Site de présentation (website/) publié sur GitHub Pages.
# Réglage unique : Settings > Pages > Build and deployment > Source : GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    env:
      PUBLIC_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      # Site de projet : https://<compte>.github.io/<depot>/. Un dépôt nommé <compte>.github.io est servi à la racine.
      - name: Déterminer l'adresse de publication
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          echo "ASTRO_SITE=https://${OWNER}.github.io" >> "$GITHUB_ENV"
          case "$REPO" in
            *.github.io) echo "ASTRO_BASE=/" >> "$GITHUB_ENV" ;;
            *) echo "ASTRO_BASE=/${REPO}" >> "$GITHUB_ENV" ;;
          esac

      - run: npm ci --ignore-scripts

      # `npm test` compile le site puis vérifie ancres, ressources et métadonnées.
      - run: npm test

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  # Seul job qui reçoit les droits de publication (pages, id-token).
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
