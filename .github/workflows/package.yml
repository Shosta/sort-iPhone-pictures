name: Package Photosort

# - Push sur main : CI puis construction des paquets, disponibles en artefacts du run (non signés, version de package.json).
# - Tag `vX.Y.Z` ou `vX.Y.Z-rc.1` sur un commit de main (créé par `npm run release`, le tag doit égaler la version de
#   package.json) : CI, paquets, SHA256SUMS, puis publication de la release. Un tag avec suffixe (`-rc.N`) donne une
#   pré-version GitHub (`--prerelease`, jamais « latest »).
# - Lancement manuel : onglet Actions > "Package Photosort" > Run workflow (depuis un tag : republie la release).
# - macOS Apple Silicon n'est construit que sur un tag ou un lancement manuel (case « macOS Apple Silicon », cochée par
#   défaut) : sur les pushes sur main, les runners macOS hébergés échouaient régulièrement avec « The job was not
#   acquired by runner of type hosted » (saturation, pas une erreur de code), ce qui rougissait chaque push.
# Aucun paquet n'est construit ni publié si la CI échoue.
on:
  workflow_dispatch:
    inputs:
      macos_arm64:
        description: Construire aussi macOS Apple Silicon
        type: boolean
        default: true
  push:
    branches: [main]
    # Les filtres de chemins ne sont pas évalués pour les tags : un tag construit toujours tout.
    paths-ignore: ['docs/**', '**/*.md', 'website/**', '.github/workflows/pages.yml', '.github/dependabot.yml']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  # Une release en cours ne doit jamais être annulée à moitié.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # Sur un tag : valide le format, vérifie qu'il pointe sur main, et en déduit la version de l'application.
  # Fait avant tout le reste pour ne pas dépenser de minutes de runners sur un tag invalide.
  prepare:
    name: Préparer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # Apple Silicon : tag, ou lancement manuel avec la case cochée (jamais sur un simple push sur main).
      - name: Déterminer la matrice des plateformes
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          MANUAL_MAC: ${{ inputs.macos_arm64 }}
        run: |
          include='[
            {"name":"macOS (Intel)","artifact":"macos-x64","os":"macos-15-intel","goos":"darwin","goarch":"amd64","builder":"--mac --x64"},
            {"name":"Linux","artifact":"linux-x64","os":"ubuntu-22.04","goos":"linux","goarch":"amd64","builder":"--linux AppImage deb --x64"},
            {"name":"Windows","artifact":"windows-x64","os":"windows-latest","goos":"windows","goarch":"amd64","builder":"--win portable --x64"}
          ]'
          mac='{"name":"macOS (Apple Silicon)","artifact":"macos-arm64","os":"macos-14","goos":"darwin","goarch":"arm64","builder":"--mac --arm64"}'
          if [ "$REF_TYPE" = tag ] || { [ "$EVENT" = workflow_dispatch ] && [ "$MANUAL_MAC" = true ]; }; then
            include=$(jq -c --argjson mac "$mac" '[$mac] + .' <<< "$include")
          else
            include=$(jq -c . <<< "$include")
          fi
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

      - name: Récupérer l'historique complet
        if: github.ref_type == 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Valider le tag et en déduire la version
        id: tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ ! "$TAG" =~ $semver ]]; then
            echo "::error::Le tag « $TAG » n'est pas une version SemVer (vX.Y.Z ou vX.Y.Z-rc.1)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le tag $TAG ne pointe pas sur un commit de main."
            exit 1
          fi
          version="${TAG#v}"
          # Le script de release (npm run release) aligne package.json sur le tag ; le suffixe -rc.N est compris.
          pkg=$(jq -r .version photosort-electron/package.json)
          if [ "$pkg" != "$version" ]; then
            echo "::error::Le tag $TAG ne correspond pas à la version de photosort-electron/package.json ($pkg)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version de l'application : $version (pré-version : $([[ "$version" == *-* ]] && echo oui || echo non))"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    name: ${{ matrix.name }}
    needs: [prepare, ci]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: photosort-electron
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: photosort-electron/package-lock.json

      # Le sidecar utilise CGO (ONNX Runtime) sur tous les OS, y compris Windows (MinGW-w64 de l'image).
      - name: Vérifier le compilateur C
        run: gcc --version | head -1

      # Sans scripts d'installation : electron-builder télécharge lui-même l'Electron à embarquer.
      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      # Compile le sidecar Go puis construit l'interface. Les modèles IA ne sont pas embarqués :
      # l'application les télécharge au premier lancement (sha256 vérifié).
      - name: Construire le sidecar et l'interface
        run: npm run build

      # Signature uniquement sur un tag et si les secrets existent ; sinon installeur non signé, sans échec.
      # Les variables de signature ne sont exportées (GITHUB_ENV) que si elles sont non vides : electron-builder
      # traite un CSC_LINK défini mais vide comme un chemin de fichier (le répertoire courant) et échoue.
      # Les valeurs ne sont jamais affichées.
      - name: Déterminer la signature
        id: signing
        env:
          IS_TAG: ${{ github.ref_type == 'tag' }}
          IN_CSC_LINK: ${{ github.ref_type == 'tag' && secrets.CSC_LINK || '' }}
          IN_CSC_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.CSC_KEY_PASSWORD || '' }}
          IN_APPLE_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_ID || '' }}
          IN_APPLE_APP_SPECIFIC_PASSWORD: ${{ github.ref_type == 'tag' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          IN_APPLE_TEAM_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_TEAM_ID || '' }}
          IN_WIN_CSC_LINK: ${{ github.ref_type == 'tag' && secrets.WIN_CSC_LINK || '' }}
          IN_WIN_CSC_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          # export_secret NOM VALEUR : masque la valeur puis l'exporte aux étapes suivantes (format multiligne).
          export_secret() {
            local line delim="ghadelim_${RANDOM}${RANDOM}${RANDOM}"
            while IFS= read -r line || [ -n "$line" ]; do
              [ -n "$line" ] && echo "::add-mask::$line"
            done <<< "$2"
            { echo "$1<<$delim"; printf '%s\n' "$2"; echo "$delim"; } >> "$GITHUB_ENV"
          }

          mac=false; notarize=false; win=false
          if [ "$IS_TAG" = true ]; then
            if [ "$GOOS" = darwin ] && [ -n "$IN_CSC_LINK" ] && [ -n "$IN_CSC_KEY_PASSWORD" ]; then
              mac=true
              export_secret CSC_LINK "$IN_CSC_LINK"
              export_secret CSC_KEY_PASSWORD "$IN_CSC_KEY_PASSWORD"
              if [ -n "$IN_APPLE_ID" ] && [ -n "$IN_APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$IN_APPLE_TEAM_ID" ]; then
                notarize=true
                export_secret APPLE_ID "$IN_APPLE_ID"
                export_secret APPLE_APP_SPECIFIC_PASSWORD "$IN_APPLE_APP_SPECIFIC_PASSWORD"
                export_secret APPLE_TEAM_ID "$IN_APPLE_TEAM_ID"
              else
                echo "::warning::Certificat macOS présent mais identifiants de notarisation absents (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID) : l'installeur sera signé mais pas notarisé (Gatekeeper le bloquera)."
              fi
            fi
            if [ "$GOOS" = windows ] && [ -n "$IN_WIN_CSC_LINK" ] && [ -n "$IN_WIN_CSC_KEY_PASSWORD" ]; then
              win=true
              export_secret WIN_CSC_LINK "$IN_WIN_CSC_LINK"
              export_secret WIN_CSC_KEY_PASSWORD "$IN_WIN_CSC_KEY_PASSWORD"
            fi
          fi
          # Sans certificat macOS, inutile de chercher une identité dans le trousseau.
          if [ "$GOOS" = darwin ] && [ "$mac" != true ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
          {
            echo "mac=$mac"
            echo "notarize=$notarize"
            echo "win=$win"
          } >> "$GITHUB_OUTPUT"
          echo "Signature macOS : $mac (notarisation : $notarize) ; Windows : $win"

      # Sur un tag, la version de l'application est celle du tag (package.json n'est pas modifié).
      - name: Générer les installeurs
        env:
          BUILDER: ${{ matrix.builder }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          read -ra args <<< "$BUILDER"
          if [ -n "$VERSION" ]; then
            args+=("-c.extraMetadata.version=$VERSION")
          fi
          npx electron-builder "${args[@]}" --publish never

      - name: Vérifier la signature et la notarisation macOS
        if: steps.signing.outputs.mac == 'true'
        env:
          NOTARIZE: ${{ steps.signing.outputs.notarize }}
        run: |
          app=$(find release -maxdepth 2 -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            echo "::error::Aucune application .app dans release/"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ "$NOTARIZE" = true ]; then
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          fi

      - name: Vérifier la signature Windows
        if: steps.signing.outputs.win == 'true'
        shell: pwsh
        run: |
          $bad = Get-ChildItem release -Filter *.exe | ForEach-Object { Get-AuthenticodeSignature $_.FullName } | Where-Object { $_.Status -ne 'Valid' }
          if ($bad) {
            $bad | Format-List Path, Status, StatusMessage
            exit 1
          }

      - name: Lister les installeurs
        run: ls -lh release

      # Un artefact par fichier, sans zip (archive: false) : le nom de l'artefact est celui du fichier,
      # donc l'AppImage et le .deb restent deux téléchargements distincts.
      - name: Publier le .dmg
        if: matrix.goos == 'darwin'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: photosort-electron/release/*.dmg
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Publier le .exe
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: photosort-electron/release/*.exe
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Publier l'AppImage
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: photosort-electron/release/*.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Publier le .deb
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: photosort-electron/release/*.deb
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    needs: [prepare, package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Photosort-*
          path: dist
          merge-multiple: true

      # Garde-fou : tous les installeurs doivent porter la version du tag.
      - name: Vérifier la version des installeurs
        run: |
          ls -lh dist
          for file in dist/*; do
            case "$(basename "$file")" in
              *"-$VERSION-"*) ;;
              *) echo "::error::$file ne porte pas la version $VERSION"; exit 1 ;;
            esac
          done

      - name: Générer et vérifier SHA256SUMS
        run: |
          node photosort-electron/scripts/checksums.mjs dist
          node photosort-electron/scripts/checksums.mjs dist --check

      - name: Publier la release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            args=(--title "Photosort $TAG" --generate-notes --verify-tag)
            if [ "$PRERELEASE" = true ]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" dist/* "${args[@]}"
          fi
